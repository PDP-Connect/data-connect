# @pdpp/connector-protocol, @pdpp/collector-runtime, and @pdpp/local-collector
# publish in lockstep from a single release channel: released from `main` to
# npm's default `latest` dist-tag, no prerelease branch. Mirrors PDP-Connect/pdpp's
# own semantic-release posture (see that repo's .releaserc.yaml) for the same
# stated reason — a second moving prerelease branch is drift risk with no
# offsetting benefit at 0.x.
#
# UNLIKE pdpp, this repository (PDP-Connect/data-connect) also ships a
# Tauri desktop app with its own commit history (build/release/ci-scoped
# commits, and plenty of unscoped feat/fix commits touching connectors,
# telemetry, and the desktop app itself — none of which should cut an npm
# release). pdpp's own commit-analyzer config has no scope gate: it
# republishes on ANY feat/fix/perf commit, relying on pdpp being
# npm-packages-plus-one-console with no unrelated commit surface. That
# assumption does not hold here, so releaseRules below explicitly requires
# a connector-protocol or collector-runtime scope (or a breaking-change
# footer on such a commit) before a commit can trigger a release — everything
# else, scoped or not, releases nothing. (@semantic-release/commit-analyzer
# has no built-in "require this scope" option; this releaseRules allowlist is
# the documented workaround — see
# ai/research/semantic-release-monorepo-scoping/ in the dotfiles repo.)
#
# IMPORTANT — two things that are NOT how this plugin's docs read at a
# glance, both confirmed by direct reproduction against the actual installed
# @semantic-release/commit-analyzer@13.0.1 (what semantic-release@25.0.9
# resolves), not by reading the README:
#
# 1. String `scope` rules match with micromatch (shell-glob syntax), NOT
#    JavaScript RegExp. `SCOPE_GLOB` below uses micromatch's extglob
#    alternation (`@(a|b)`) to match "connector-protocol or collector-runtime
#    is this commit's whole scope, or one comma-separated entry anywhere in a
#    multi-package scope" (this repo's existing convention for commits
#    touching several workspaces at once, e.g.
#    `fix(collector-runtime,connector-protocol,local-collector): ...`).
#
# 2. A naive catch-all `{ release: false }` as the last rule does NOT safely
#    mean "everything else releases nothing" — it means "this rule's
#    unconditional match beats every other commit in the same release batch",
#    because analyze-commit.js's own rule-priority comparator treats `false`
#    as higher-priority than any real release type (an off-by-one in how it
#    ranks a type that isn't in its known list). Reproduced directly: a
#    release batch containing one `fix(collector-runtime): ...` commit AND
#    one unrelated `fix(local-collector): ...` commit produced NO release at
#    all with a naive catch-all — the unrelated commit silently cancelled the
#    real one. The two catch-alls below are written to be mutually exclusive
#    with the five rules above (matching only scopes that are NOT
#    collector-runtime/connector-protocol, or commits with no scope at all)
#    so they never co-match the same commit as a real rule and can never
#    cancel it. Full verified test matrix (18 single-commit cases + 4
#    multi-commit batch cases, all passing) is not committed here; re-derive
#    by testing analyzeCommits() directly against this file's exact rules
#    before changing them.
branches:
  - name: main
tagFormat: "v${version}"
preset: "conventionalcommits"
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          scope: &SCOPE_GLOB "@(collector-runtime|connector-protocol|local-collector)*|*,@(collector-runtime|connector-protocol|local-collector)|*,@(collector-runtime|connector-protocol|local-collector),*"
          release: major
        - type: feat
          scope: *SCOPE_GLOB
          release: minor
        - type: fix
          scope: *SCOPE_GLOB
          release: patch
        - type: perf
          scope: *SCOPE_GLOB
          release: patch
        - type: revert
          scope: *SCOPE_GLOB
          release: patch
        # Matches any commit whose scope is a real string that is NOT one of
        # the target packages (e.g. `fix(polyfill-connectors): ...`).
        # Mutually exclusive with the five rules above by construction — this
        # negation must stay the exact complement of SCOPE_GLOB, or a commit
        # can match both a real rule and this one, and the `false` wins and
        # silently cancels the whole release batch (see the header note).
        - scope: "!(@(collector-runtime|connector-protocol|local-collector)*|*,@(collector-runtime|connector-protocol|local-collector)|*,@(collector-runtime|connector-protocol|local-collector),*)"
          release: false
        # Matches genuinely unscoped commits (conventional-commits-parser
        # sets `scope: null`, not `undefined`, when a commit has no
        # `(scope)` at all — this must be `null`, not omitted, or this rule
        # would match every commit unconditionally, including target-scoped
        # ones, recreating the same cancellation bug this design avoids).
        - scope: null
          release: false
      presetConfig:
        types:
          - type: feat
            scope: connector-protocol
            section: "Features (@pdpp/connector-protocol)"
          - type: fix
            scope: connector-protocol
            section: "Bug Fixes (@pdpp/connector-protocol)"
          - type: perf
            scope: connector-protocol
            section: "Performance Improvements (@pdpp/connector-protocol)"
          - type: feat
            scope: collector-runtime
            section: "Features (@pdpp/collector-runtime)"
          - type: fix
            scope: collector-runtime
            section: "Bug Fixes (@pdpp/collector-runtime)"
          - type: perf
            scope: collector-runtime
            section: "Performance Improvements (@pdpp/collector-runtime)"
          - type: feat
            scope: local-collector
            section: "Features (@pdpp/local-collector)"
          - type: fix
            scope: local-collector
            section: "Bug Fixes (@pdpp/local-collector)"
          - type: perf
            scope: local-collector
            section: "Performance Improvements (@pdpp/local-collector)"
          - type: revert
            section: "Reverts"
  # Pins collector-runtime's dependency on connector-protocol to this
  # release's actual computed version before either @semantic-release/npm
  # prepare step below runs `npm version`/`npm pack`. Both packages share
  # one nextRelease.version (lockstep release, not independent monorepo
  # versioning) — see the script for why a naive fixed pin breaks a
  # published install whenever connector-protocol adds exports
  # collector-runtime depends on.
  - - "@semantic-release/exec"
    - prepareCmd: "node --import tsx scripts/pin-collector-runtime-protocol-dependency.ts ${nextRelease.version}"
  # Each of the three packages publishes through ./scripts/idempotent-npm-publish.mjs
  # rather than "@semantic-release/npm" directly. That wrapper re-exports the
  # real plugin's verifyConditions and prepare UNCHANGED and wraps only
  # publish, so that publishing a version already live on the registry is a
  # SKIP rather than an E403.
  #
  # This is what makes a re-run converge instead of crash. semantic-release
  # pushes the git tag BEFORE it publishes anything (index.js tags and pushes,
  # then calls plugins.publish), so a crash mid-publish leaves a tag claiming
  # a release the registry only partly holds. The tag is not the defect — it
  # is the durable record of which version this release meant to produce, and
  # deleting it would strand the packages that did publish. The defect was
  # that the publish step could not be run twice: npm versions are immutable,
  # and the stock plugin's `npm publish` is unconditional.
  #
  # With all three routed through the wrapper, running the release again
  # always moves the registry toward the tag's version and never away from it,
  # regardless of where the previous run stopped.
  - - "./scripts/idempotent-npm-publish.mjs"
    - pkgRoot: "packages/connector-protocol"
  # Explicit publish-ordering barrier, not an implicit reliance on
  # plugins-array position: semantic-release's publish lifecycle already
  # awaits each step in order (connector-protocol's `npm publish` above
  # only returns once the registry has accepted the tarball), so
  # collector-runtime's publish step below can never start before
  # connector-protocol is live — but that guarantee is easy to silently
  # break (a reorder, an inserted plugin). This step makes it fail loudly
  # instead: it re-fetches connector-protocol@<this release's version>
  # from the same registry npm publish just used and aborts the release
  # before collector-runtime is published if it isn't there.
  - - "@semantic-release/exec"
    - publishCmd: "node --import tsx scripts/verify-connector-protocol-published.ts ${nextRelease.version}"
  - - "./scripts/idempotent-npm-publish.mjs"
    - pkgRoot: "packages/collector-runtime"
  # @pdpp/local-collector publishes last in this lockstep stream. It is the
  # only one of the three that is an end-user CLI (`npx @pdpp/local-collector`)
  # rather than a library, and its `prepack` builds against the other two
  # workspaces, so publishing it after them keeps the published set
  # internally consistent for the version this release computes.
  #
  # Version continuity: this package published independently up to 1.5.4
  # before release responsibility moved to this repository (see pdpp's
  # .releaserc.yaml). Joining this stream is what keeps the next publish
  # ABOVE that line rather than colliding with it: semantic-release derives
  # the version from this repo's `v${version}` git tags, whose highest is
  # already v2.1.0 (= the published @pdpp/connector-protocol@2.1.0), so the
  # next release is >= 2.1.1 and strictly greater than 1.5.4. The version
  # field in each package.json stays a placeholder; the npm publish plugin
  # sets the real version at publish time.
  - - "./scripts/idempotent-npm-publish.mjs"
    - pkgRoot: "packages/local-collector"
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      failTitle: false
      labels: false
      releasedLabels: false
  - - "@semantic-release/exec"
    - publishCmd: "node --import tsx scripts/semantic-release-github-output.ts publish ${nextRelease.version} ${nextRelease.gitTag}"
