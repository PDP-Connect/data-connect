# @pdpp/connector-protocol, @pdpp/collector-runtime, @pdpp/local-collector,
# @pdpp/read-core, @pdpp/cli and @pdpp/mcp-server publish in lockstep from a
# single release channel: released from `main` to
# npm's default `latest` dist-tag, no prerelease branch. Mirrors PDP-Connect/pdpp's
# own semantic-release posture (see that repo's .releaserc.yaml) for the same
# stated reason — a second moving prerelease branch is drift risk with no
# offsetting benefit at 0.x.
#
# UNLIKE pdpp, this repository (PDP-Connect/data-connect) also ships a
# Tauri desktop app with its own commit history (build/release/ci-scoped
# commits, and plenty of unscoped feat/fix commits touching connectors,
# telemetry, and the desktop app itself — none of which should cut an npm
# release). pdpp's own commit-analyzer config has no scope gate: it
# republishes on ANY feat/fix/perf commit, relying on pdpp being
# npm-packages-plus-one-console with no unrelated commit surface. That
# assumption does not hold here, so releaseRules below explicitly requires
# the scope of one of the published packages (or a breaking-change footer on
# such a commit) before a commit can trigger a release — everything
# else, scoped or not, releases nothing. (@semantic-release/commit-analyzer
# has no built-in "require this scope" option; this releaseRules allowlist is
# the documented workaround — see
# ai/research/semantic-release-monorepo-scoping/ in the dotfiles repo.)
#
# IMPORTANT — two things that are NOT how this plugin's docs read at a
# glance, both confirmed by direct reproduction against the actual installed
# @semantic-release/commit-analyzer@13.0.1 (what semantic-release@25.0.9
# resolves), not by reading the README:
#
# 1. String `scope` rules match with micromatch (shell-glob syntax), NOT
#    JavaScript RegExp. `SCOPE_GLOB` below uses micromatch's extglob
#    alternation (`@(a|b)`) to match "a published package is this commit's
#    whole scope, or one comma-separated entry anywhere in a multi-package
#    scope". Each alternative names the whole entry, so `cli` does not match
#    `client` or `cli-docs` (this repo's existing convention for commits
#    touching several workspaces at once, e.g.
#    `fix(collector-runtime,connector-protocol,local-collector): ...`).
#
# 2. A naive catch-all `{ release: false }` as the last rule does NOT safely
#    mean "everything else releases nothing" — it means "this rule's
#    unconditional match beats every other commit in the same release batch",
#    because analyze-commit.js's own rule-priority comparator treats `false`
#    as higher-priority than any real release type (an off-by-one in how it
#    ranks a type that isn't in its known list). Reproduced directly: a
#    release batch containing one `fix(collector-runtime): ...` commit AND
#    one unrelated `fix(local-collector): ...` commit produced NO release at
#    all with a naive catch-all — the unrelated commit silently cancelled the
#    real one. The two catch-alls below are written to be mutually exclusive
#    with the five rules above (matching only scopes that name no published
#    package, or commits with no scope at all) so they never co-match the
#    same commit as a real rule and can never cancel it.
#    scripts/npm-release-commit-analyzer.test.ts drives analyzeCommits()
#    against this file's exact rules; extend it before changing them.
branches:
  - name: main
tagFormat: "npm-v${version}"
preset: "conventionalcommits"
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          scope: &SCOPE_GLOB "@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server)|@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server),*|*,@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server)|*,@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server),*"
          release: major
        - type: feat
          scope: *SCOPE_GLOB
          release: minor
        - type: fix
          scope: *SCOPE_GLOB
          release: patch
        - type: perf
          scope: *SCOPE_GLOB
          release: patch
        - type: revert
          scope: *SCOPE_GLOB
          release: patch
        # Matches any commit whose scope is a real string that is NOT one of
        # the target packages (e.g. `fix(polyfill-connectors): ...`).
        # Mutually exclusive with the five rules above by construction — this
        # negation must stay the exact complement of SCOPE_GLOB, or a commit
        # can match both a real rule and this one, and the `false` wins and
        # silently cancels the whole release batch (see the header note).
        - scope: "!(@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server)|@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server),*|*,@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server)|*,@(collector-runtime|connector-protocol|local-collector|read-core|cli|mcp-server),*)"
          release: false
        # Matches genuinely unscoped commits (conventional-commits-parser
        # sets `scope: null`, not `undefined`, when a commit has no
        # `(scope)` at all — this must be `null`, not omitted, or this rule
        # would match every commit unconditionally, including target-scoped
        # ones, recreating the same cancellation bug this design avoids).
        - scope: null
          release: false
      presetConfig:
        types:
          - type: feat
            scope: connector-protocol
            section: "Features (@pdpp/connector-protocol)"
          - type: fix
            scope: connector-protocol
            section: "Bug Fixes (@pdpp/connector-protocol)"
          - type: perf
            scope: connector-protocol
            section: "Performance Improvements (@pdpp/connector-protocol)"
          - type: feat
            scope: collector-runtime
            section: "Features (@pdpp/collector-runtime)"
          - type: fix
            scope: collector-runtime
            section: "Bug Fixes (@pdpp/collector-runtime)"
          - type: perf
            scope: collector-runtime
            section: "Performance Improvements (@pdpp/collector-runtime)"
          - type: feat
            scope: local-collector
            section: "Features (@pdpp/local-collector)"
          - type: fix
            scope: local-collector
            section: "Bug Fixes (@pdpp/local-collector)"
          - type: perf
            scope: local-collector
            section: "Performance Improvements (@pdpp/local-collector)"
          - type: feat
            scope: read-core
            section: "Features (@pdpp/read-core)"
          - type: fix
            scope: read-core
            section: "Bug Fixes (@pdpp/read-core)"
          - type: perf
            scope: read-core
            section: "Performance Improvements (@pdpp/read-core)"
          - type: feat
            scope: cli
            section: "Features (@pdpp/cli)"
          - type: fix
            scope: cli
            section: "Bug Fixes (@pdpp/cli)"
          - type: perf
            scope: cli
            section: "Performance Improvements (@pdpp/cli)"
          - type: feat
            scope: mcp-server
            section: "Features (@pdpp/mcp-server)"
          - type: fix
            scope: mcp-server
            section: "Bug Fixes (@pdpp/mcp-server)"
          - type: perf
            scope: mcp-server
            section: "Performance Improvements (@pdpp/mcp-server)"
          - type: revert
            section: "Reverts"
  # Pins every dependency one published package has on another to this
  # release's computed version before any @semantic-release/npm prepare step
  # below runs `npm version`/`npm pack`. All six share one
  # nextRelease.version (lockstep release, not independent monorepo
  # versioning). The workspace manifests name each other loosely
  # (`0.0.1`, `*`); published as written, `@pdpp/mcp-server` would accept any
  # `@pdpp/cli`, including one released before this one. See the script.
  - - "@semantic-release/exec"
    - prepareCmd: "node --import tsx scripts/pin-lockstep-dependencies.ts ${nextRelease.version}"
  # The packages publish in sequence, in the order of the
  # @semantic-release/npm steps below; that order is the package list every
  # release script reads (scripts/lockstep-packages.ts). A run that dies
  # mid-sequence leaves the version incomplete and is not resumable:
  # semantic-release pushes the git tag BEFORE it publishes (index.js tags and
  # pushes, then calls plugins.publish), so a later run on that commit resolves
  # zero commits and no version and never reaches publish. The next release
  # supersedes the incomplete one — see scripts/resolve-release-version.ts.
  - - "@semantic-release/npm"
    - pkgRoot: "packages/connector-protocol"
  # Explicit publish-ordering barriers, not an implicit reliance on
  # plugins-array position: semantic-release's publish lifecycle already
  # awaits each step in order (an `npm publish` only returns once the
  # registry has accepted the tarball), so a package's publish step can never
  # start before the steps above it — but that guarantee is easy to silently
  # break (a reorder, an inserted plugin). Each barrier names the package it
  # guards, re-fetches every published package that one depends on at this
  # release's version from the same registry npm publish just used, and
  # aborts the release before the guarded package is published if any is
  # missing.
  - - "@semantic-release/exec"
    - publishCmd: "node --import tsx scripts/verify-lockstep-dependencies-published.ts ${nextRelease.version} packages/collector-runtime"
  - - "@semantic-release/npm"
    - pkgRoot: "packages/collector-runtime"
  # @pdpp/local-collector is an end-user CLI (`npx @pdpp/local-collector`)
  # rather than a library, and its `prepack` builds against the two packages
  # above, so publishing it after them keeps the published set internally
  # consistent for the version this release computes.
  #
  # Version continuity: this package published independently up to 1.5.4
  # before release responsibility moved to this repository (see pdpp's
  # .releaserc.yaml). Joining this stream is what keeps the next publish
  # ABOVE that line rather than colliding with it: semantic-release derives
  # the version from this repo's `npm-v${version}` git tags (migrated from legacy
  # v* tags by scripts/npm-release-tags.mjs), whose original baseline was
  # v2.1.0 (= the published @pdpp/connector-protocol@2.1.0), so the
  # next release is >= 2.1.1 and strictly greater than 1.5.4. The version
  # field in each package.json stays a placeholder; the npm publish plugin
  # sets the real version at publish time.
  - - "@semantic-release/npm"
    - pkgRoot: "packages/local-collector"
  # @pdpp/read-core, @pdpp/cli and @pdpp/mcp-server published from
  # PDP-Connect/pdpp up to 1.8.0. They joined this stream at npm-v2.5.2's
  # successor, so their next version is above 2.5.2 and above 1.8.0. The
  # MCP server depends on the other two and publishes after them.
  - - "@semantic-release/npm"
    - pkgRoot: "reference-implementation/vendor/read-core"
  - - "@semantic-release/npm"
    - pkgRoot: "reference-implementation/vendor/cli"
  - - "@semantic-release/exec"
    - publishCmd: "node --import tsx scripts/verify-lockstep-dependencies-published.ts ${nextRelease.version} reference-implementation/vendor/mcp-server"
  - - "@semantic-release/npm"
    - pkgRoot: "reference-implementation/vendor/mcp-server"
  - - "@semantic-release/exec"
    - publishCmd: "node --import tsx scripts/semantic-release-github-output.ts publish ${nextRelease.version} ${nextRelease.gitTag}"
