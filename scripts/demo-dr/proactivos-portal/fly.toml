# fly.toml — simulated Servicios Proactivos portal (proactivos-demo-rd), a PDPP
# client of pdpp-demo-rd. Demo only; in-memory sessions, no volume.
#
# Deploy (build context = this directory):
#   cd scripts/demo-dr/proactivos-portal && fly deploy --ha=false
# --ha=false keeps one machine: sessions are in memory, a second machine
# would lose the OAuth state between /decir-si and /callback.
#
# First time: fly apps create proactivos-demo-rd

app = "proactivos-demo-rd"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTAL_ORIGIN = "https://proactivos-demo-rd.fly.dev"
  PDPP_ORIGIN = "https://pdpp-demo-rd.fly.dev"

# Always on; one machine only (sessions live in memory).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  grace_period = "10s"
  interval = "30s"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
