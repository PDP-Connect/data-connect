services:
  reference:
    environment:
      NODE_ENV: development
      PDPP_EMBEDDING_CACHE_DIR: /var/cache/pdpp/transformers
    command: >
      sh -lc 'node --env-file-if-exists=.env.local --import tsx --watch reference-implementation/server/index.ts'
    volumes:
      - .:/app
      - pdpp-root-node-modules:/app/node_modules
      - pdpp-reference-node-modules:/app/reference-implementation/node_modules
      - pdpp-polyfill-node-modules:/app/packages/polyfill-connectors/node_modules
      - pdpp-brand-node-modules:/app/reference-implementation/vendor/brand/node_modules
      - ./packages/polyfill-connectors/.pdpp-data:/var/lib/pdpp
      - pdpp-transformers:/var/cache/pdpp/transformers
      - pdpp-home:/root/.pdpp

  # Operator console dev service. Runs apps/console directly (this repo's own
  # standalone Next.js app; see docker-compose.yml's own `web` service
  # comment for why this is no longer a stage of deploy/docker/Dockerfile the
  # way pdpp's apps/console was a stage of its root Dockerfile).
  web:
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PDPP_WEB_ALLOWED_DEV_ORIGINS: ${PDPP_WEB_ALLOWED_DEV_ORIGINS:-}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    command: >
      sh -lc 'cd apps/console && npx next dev --webpack --hostname 0.0.0.0 --port 3000'
    volumes:
      - .:/app
      - pdpp-root-node-modules:/app/node_modules
      - pdpp-reference-node-modules:/app/reference-implementation/node_modules
      - pdpp-console-node-modules:/app/apps/console/node_modules
      - pdpp-console-next:/app/apps/console/.next
      - pdpp-polyfill-node-modules:/app/packages/polyfill-connectors/node_modules
      - pdpp-brand-node-modules:/app/reference-implementation/vendor/brand/node_modules

volumes:
  pdpp-root-node-modules:
  pdpp-reference-node-modules:
  pdpp-console-node-modules:
  pdpp-console-next:
  pdpp-polyfill-node-modules:
  pdpp-brand-node-modules:
