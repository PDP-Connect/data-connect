  Standalone owner-password window for the managed desktop app. The console
  window is WebviewUrl::External and has no invoke() bridge, so Settings asks
  Rust to open this app-origin window through owner-password-window-request.json.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataConnect - Set owner password</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
      }
      p {
        margin: 0.4rem 0;
        font-size: 0.9rem;
        line-height: 1.45;
        opacity: 0.85;
      }
      form {
        display: grid;
        gap: 0.8rem;
        margin-top: 1.2rem;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.9rem;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 6px;
        padding: 0.6rem;
        background: Canvas;
        color: CanvasText;
        font-size: 0.95rem;
      }
      button {
        justify-self: start;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 6px;
        padding: 0.5rem 1rem;
        background: CanvasText;
        color: Canvas;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #error {
        display: none;
        margin-top: 0.2rem;
        border: 1px solid #d33;
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        color: #d33;
        font-size: 0.85rem;
      }
      #error.visible {
        display: block;
      }
      .hint {
        font-size: 0.82rem;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <h1>Set owner password</h1>
    <p>
      Choose the password you will use from another browser or device when remote access is on.
    </p>
    <p class="hint">
      Use at least 15 characters. DataConnect stores it in this computer's secure credential store.
    </p>
    <form id="password-form">
      <label>
        New owner password
        <input
          id="password-input"
          autocomplete="new-password"
          minlength="15"
          required
          type="password"
        />
      </label>
      <label>
        Confirm password
        <input
          id="confirmation-input"
          autocomplete="new-password"
          minlength="15"
          required
          type="password"
        />
      </label>
      <button id="submit-button" type="submit">Set password</button>
      <div id="error" role="alert"></div>
    </form>
    <script>
      const form = document.getElementById("password-form");
      const passwordInput = document.getElementById("password-input");
      const confirmationInput = document.getElementById("confirmation-input");
      const button = document.getElementById("submit-button");
      const errorBox = document.getElementById("error");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add("visible");
      }

      function clearError() {
        errorBox.textContent = "";
        errorBox.classList.remove("visible");
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        void submitPassword();
      });

      async function submitPassword() {
        const password = passwordInput.value;
        const confirmation = confirmationInput.value;
        clearError();
        if (Array.from(password).length < 15) {
          showError("Use at least 15 characters.");
          return;
        }
        if (password !== confirmation) {
          showError("The passwords do not match.");
          return;
        }
        const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
        if (typeof invoke !== "function") {
          showError("This window cannot reach DataConnect. Restart the app and try again.");
          return;
        }
        button.disabled = true;
        button.textContent = "Saving...";
        try {
          await invoke("set_desktop_owner_password", { password });
        } catch (error) {
          showError(typeof error === "string" ? error : "Could not set the owner password.");
          button.disabled = false;
          button.textContent = "Set password";
        }
      }
    </script>
  </body>
</html>
