<!DOCTYPE html>
<!--

  SPDX-License-Identifier: Apache-2.0

  Standalone owner-password window for the managed desktop app. The console
  window is WebviewUrl::External and has no invoke() bridge, so Settings asks
  Rust to open this app-origin window through owner-password-window-request.json.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataConnect - Set owner password</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
      }
      p {
        margin: 0.4rem 0;
        font-size: 0.9rem;
        line-height: 1.45;
        opacity: 0.85;
      }
      form {
        display: grid;
        gap: 0.8rem;
        margin-top: 1.2rem;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.9rem;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 6px;
        padding: 0.6rem;
        background: Canvas;
        color: CanvasText;
        font-size: 0.95rem;
      }
      button {
        justify-self: start;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 6px;
        padding: 0.5rem 1rem;
        background: CanvasText;
        color: Canvas;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #error {
        display: none;
        margin-top: 0.2rem;
        border: 1px solid #d33;
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        color: #d33;
        font-size: 0.85rem;
      }
      #error.visible {
        display: block;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
      }
      button.quiet {
        background: transparent;
        color: CanvasText;
        border: 1px solid GrayText;
        padding: 0.3rem 0.7rem;
        font-size: 0.82rem;
      }
      .hint {
        font-size: 0.82rem;
        opacity: 0.72;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Set owner password</h1>
    <p>
      Once remote access is on, anyone with your address reaches the sign-in page. This password is the only
      way in.
    </p>
    <form id="password-form" novalidate>
      <input
        class="visually-hidden"
        id="username-input"
        name="username"
        autocomplete="username"
        value="owner"
        tabindex="-1"
        readonly
      />
      <label>
        <span id="field-label">New password</span>
        <input
          id="password-input"
          autocomplete="new-password"
          minlength="15"
          required
          type="password"
        />
      </label>
      <label>
        <span id="confirm-label">Confirm password</span>
        <input
          id="confirm-input"
          autocomplete="new-password"
          minlength="15"
          required
          type="password"
        />
      </label>
      <div class="actions">
        <button class="quiet" id="toggle-button" type="button" aria-pressed="false" aria-controls="password-input confirm-input">Show</button>
        <button class="quiet" id="suggest-button" type="button">Suggest a password</button>
        <button class="quiet" id="copy-button" type="button">Copy</button>
      </div>
      <p class="hint" id="field-hint">
        At least 15 characters. Longer is safer.
      </p>
      <button id="submit-button" type="submit">Save password and continue</button>
      <div id="error" role="alert"></div>
    </form>
    <script type="module">
      import { mountOwnerPasswordDialog } from "/passphrase/dialog.js";

      mountOwnerPasswordDialog(document, {
        invoke: window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke,
        clipboard: navigator.clipboard,
      });
    </script>
  </body>
</html>
