[package]
name = "dataconnect"
version = "0.1.0"
description = "DataConnect - Export your data from various platforms"
authors = ["DataConnect Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dataconnect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["test", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2.6"
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
zip = "8.6"
walkdir = "2"
futures-util = "0.3"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
# `sigstore` 0.14.0 depends on `sha2 = "0.10"`, one major behind this crate's
# own `sha2 = "0.11"`; that makes `sigstore::bundle::verify::Verifier::verify_digest`'s
# `Sha256` a different type than the one this crate otherwise uses, even
# though both are `sha2::Sha256`. This renamed dependency exists only to
# construct the exact hasher type that API needs — remove it once `sigstore`
# updates its own `sha2` requirement to 0.11 or later.
sha2-for-sigstore = { package = "sha2", version = "0.10" }
hex = "0.4"
sigstore = { version = "0.14", default-features = false, features = ["bundle", "verify", "sigstore-trust-root", "rustls-tls"] }
oci-client = "0.18"
semver = "1.0"
dirs = "7.0"
dotenvy = "0.15"
mime_guess = "2.0.5"
flate2 = "1.0"
fs2 = "0.4"
tar = "0.4"
tempfile = "3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# `tauri-plugin-mcp-bridge` 0.13.0 pins `webview2-com` 0.38 and `windows` 0.61, while
# `wry` 0.57 (Tauri 2.12) uses `webview2-com` 0.39 and `windows` 0.62. The bridge's
# Windows screenshot code then fails to compile against wry's WebView2 types. The
# bridge is a debug-only developer tool, so build it everywhere except Windows
# until an upstream release moves to `webview2-com` 0.39.
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-mcp-bridge = "0.13.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
