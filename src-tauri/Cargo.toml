[package]
name = "dataconnect"
default-run = "dataconnect"
version = "0.1.0"
description = "DataConnect - Export your data from various platforms"
authors = ["DataConnect Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "dataconnect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stall_repro"
path = "src/bin/stall_repro.rs"
required-features = ["stall-repro"]

[[bin]]
name = "winclose_repro"
path = "src/bin/winclose_repro.rs"
required-features = ["stall-repro"]

[[bin]]
name = "pdeathsig_port_repro"
path = "src/bin/pdeathsig_port_repro.rs"
required-features = ["stall-repro"]

[[bin]]
name = "titlebar_repro"
path = "src/bin/titlebar_repro.rs"
required-features = ["stall-repro"]

[features]
stall-repro = []

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["test", "unstable", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2.6"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
zip = "8.6"
walkdir = "2"
futures-util = "0.3"
base64 = "0.23"
getrandom = "0.3.4"
keyring = "4.2.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sigstore = { version = "0.14", default-features = false, features = ["bundle", "verify", "sigstore-trust-root", "rustls-tls"] }
oci-client = "0.17"
semver = "1.0"
dirs = "7.0"
dotenvy = "0.15"
mime_guess = "2.0.5"
flate2 = "1.0"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4"
tempfile = "3"
tauri-plugin-mcp-bridge = "0.13.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
ngrok = "0.19.0"
url = "2.5"
open = "5.3.3"
uuid = { version = "1.22", features = ["v4"] }
aes-gcm = "0.11.1"
scrypt = { version = "0.12.0", default-features = false, features = ["kdf"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4.4"

# Windows CI (build (windows-latest, ...)) failed after the tao 0.37.0 bump
# below with `error[E0432]: unresolved import windows::Win32::UI::Controls`
# in tauri-runtime-wry's dialog/windows.rs. Root cause, confirmed against
# the actual resolved dependency graph (`cargo tree --target
# x86_64-pc-windows-msvc -i windows@0.61.3`): tauri-runtime-wry's own
# Cargo.toml requests `windows = "0.61"` with features =
# ["Win32_Foundation", "Win32_Graphics_Dwm"] -- it compiles against a
# SEPARATE windows 0.61.3 instance from the windows 0.62.2 that tao
# 0.37.0 requires (`^0.61` and `^0.62` cannot unify to one crate instance
# under semver), and tauri-runtime-wry never directly requests
# Win32_UI_Controls on its own 0.61.3 instance -- it was relying on some
# other crate in the graph pulling that feature in for the SAME windows
# instance via Cargo's additive-but-per-instance feature unification.
# Under tao 0.35.3 (both tao and tauri-runtime-wry sharing one windows
# 0.61.x instance) that incidentally worked; splitting into two instances
# broke it. windows 0.61.3 still has the Controls module (confirmed:
# crates.io source, Win32/UI/mod.rs), it is just feature-gated
# (`Win32_UI_Controls`) and nothing else in the graph turns it on for
# THIS specific 0.61.3 instance. Force it on directly, pinned to the same
# 0.61 range tauri-runtime-wry itself uses (NOT 0.62 -- a first attempt
# at this fix added the feature to the wrong, 0.62.2 instance and did not
# actually resolve the compile error, since tauri-runtime-wry never
# touches that instance at all).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Controls"] }

# RETIRE THIS PATCH WHEN (checked 2026-09-21 against the crates.io sparse index,
# https://index.crates.io/ta/ur/tauri-runtime-wry and https://index.crates.io/ta/ur/tauri
# -- re-run the same query to check again):
#   EITHER a published, STABLE (non-alpha) tauri 2.x release depends on a
#   tauri-runtime-wry release whose own `tao` requirement is `>= 0.37`
#   (as of this check, the newest stable tauri-runtime-wry is 2.11.4, published
#   2026-06-30, requiring tao "^0.35.0"; the newest stable tauri is 2.11.6,
#   published 2026-09-19, still pinned to tauri-runtime-wry "^2.11.4"; the only
#   published tauri-runtime-wry releases requiring tao ">=0.37" are
#   3.0.0-alpha.0/1/2, which are not stable),
#   OR this app migrates to Tauri 3.0 stable (not alpha).
# Until then, no real upgrade path exists -- this fork patch is the only way to
# get the Wayland titlebar hit-testing fix (tao#1046/#1122,
# tauri-apps/tauri#13440) onto the current stable Tauri 2.x line.
#
# Fork-patch to relax tauri-runtime-wry's `tao = "^0.35.0"` requirement so we can
# pull tao >=0.36, which fixes an unconditional Wayland CSD EventBox overlay
# (tao#1046/#1122, tauri-apps/tauri#13440) that breaks titlebar button
# hit-testing after a window is hidden and re-shown. No published tauri 2.x
# release pulls tao >=0.36 (that lands only on the 3.0.0-alpha line, which
# would require migrating ~15 tauri-plugin-* deps to their own 3.0-alpha
# releases -- several don't have one). This patches only tauri-runtime-wry's
# Cargo.toml manifest (one line, the `tao` version requirement), starting
# from the tauri-apps/tauri monorepo pinned at tag tauri-runtime-wry-v2.11.4
# (commit ca90b46b2e2cbbc981dae1b809f4af4343fe0558). No Rust source was
# modified. tauri-runtime and tauri-utils must be patched from the same
# source in lockstep because they are path-sibling dependencies of
# tauri-runtime-wry inside that monorepo checkout -- patching
# tauri-runtime-wry alone causes cargo to pull a second, differently-sourced
# copy of tauri-runtime, which Rust then treats as a distinct type from the
# one tauri itself uses (`the trait tauri_runtime::Runtime<EventLoopMessage>
# is not implemented for tauri_runtime_wry::Wry<EventLoopMessage>`).
#
# A local `path = "..."` patch was tried first and built locally, but fails
# in CI (and on any other machine) with "failed to load source for
# dependency `tauri-runtime`... No such file or directory" -- a path patch
# resolves to an absolute filesystem path that only exists on the machine
# that created it. Fixed by publishing the one-line manifest change to a
# real, network-reachable git remote and patching from there instead, with
# an explicit commit pin (never a mutable branch ref) so the resolved
# dependency is reproducible.
#
# Fork: https://github.com/tnunamak/tauri, branch
# `tao-0.37-compat-for-dataconnect`, pinned at commit
# 1598c1df37f87fe76a08ed18e0b8fa7b270c3d16 (one commit ahead of
# tauri-runtime-wry-v2.11.4 / ca90b46b2e2cbbc981dae1b809f4af4343fe0558,
# containing only the `tao` version-range relaxation below). Reproduce:
#   git clone --branch tauri-runtime-wry-v2.11.4 \
#     https://github.com/tauri-apps/tauri.git tauri-fork
#   # edit crates/tauri-runtime-wry/Cargo.toml:
#   #   tao = { version = "0.35.0", ... } -> tao = { version = ">=0.35.0, <0.38.0", ... }
[patch.crates-io]
tauri-runtime = { git = "https://github.com/tnunamak/tauri", rev = "1598c1df37f87fe76a08ed18e0b8fa7b270c3d16" }
tauri-utils = { git = "https://github.com/tnunamak/tauri", rev = "1598c1df37f87fe76a08ed18e0b8fa7b270c3d16" }
tauri-runtime-wry = { git = "https://github.com/tnunamak/tauri", rev = "1598c1df37f87fe76a08ed18e0b8fa7b270c3d16" }

[target.'cfg(target_os = "macos")'.dependencies]
# run_lease.rs's process-identity check has no /proc filesystem to read on
# macOS (Linux keeps its existing hand-rolled /proc/<pid>/stat parser,
# untouched; Windows already has its own #[cfg(not(unix))] no-op path in the
# same module and does not need this).
#
# Pinned to 0.38, not the newer 0.39 line: 0.39 requires Rust 1.95, above
# this crate's own declared rust-version = "1.88" (Cargo.toml, package
# section) and above the 1.94.0 toolchain available in this review's
# sandbox, which cannot compile 0.39 at all. 0.38.4 requires exactly 1.88,
# matching this crate's MSRV -- verified against crates.io's published
# rust_version per release, not assumed.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
