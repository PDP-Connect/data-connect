version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Patchright must move together with pdpp-runtime/package-lock.json and
      # playwright-runner, which this entry does not update.
      # scripts/check-patchright-version.mjs fails CI on a partial bump.
      - dependency-name: patchright
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
