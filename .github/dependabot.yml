version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    # The browser dependencies are declared in three places, and CI, the Docker
    # image and the desktop app must launch the same Chromium. scripts/
    # check-patchright-version.mjs fails CI when they drift apart.
    directories:
      - /
      - /pdpp-runtime
      - /playwright-runner
    schedule:
      interval: weekly
    groups:
      browser:
        applies-to: version-updates
        # Dependabot opens one pull request per dependency name across the
        # directories, so patchright and playwright arrive as two pull requests.
        # Each fails the version check until both are merged together.
        group-by: dependency-name
        patterns:
          - patchright
          - patchright-core
          - playwright
          - playwright-core
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - patchright
          - patchright-core
          - playwright
          - playwright-core
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
