name: local-collector pack-install-run

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pack-install-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Pack, install, and run @pdpp/local-collector in a clean project
        working-directory: packages/local-collector
        run: npm run pack-install-run
