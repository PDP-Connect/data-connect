name: local-collector pack-install-run

env:
  # onnxruntime-node's install script downloads the CUDA 12 provider binaries
  # from nuget.org on linux/x64 even on CPU-only runners; that download is the
  # ETIMEDOUT flake that fails `npm ci`. No job here requests the CUDA execution
  # provider and the CPU binding ships in the package tarball, so skip it.
  # scripts/ci-onnxruntime-install.test.ts guards this setting.
  ONNXRUNTIME_NODE_INSTALL: "skip"

on:
  pull_request:
    # PRs into the test-engineering integration branch are gated by a local
    # oracle and review; full CI runs once on the batch PR into main.
    branches-ignore: [testeng/integration]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pack-install-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      # Runs before pack-install-run so an undeclared bare specifier fails at the
      # guard that names it rather than as an opaque resolution error at install.
      - name: Validate @pdpp/local-collector package manifest
        working-directory: packages/local-collector
        run: npm run validate:package

      - name: Pack, install, and run @pdpp/local-collector in a clean project
        working-directory: packages/local-collector
        run: npm run pack-install-run
