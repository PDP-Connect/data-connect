name: package-verify

# Runs each npm package's `verify` on the pull request that changes its
# inputs, so a broken package fails on its own PR instead of on main.
#
# Before this workflow, these `verify` scripts ran only in npm-release's
# `quality` job: after merge, and only when a release was due. #448 bumped
# zod in packages/connector-protocol/package.json without regenerating
# artifact.json, and nothing failed until a later push to main resolved a
# release.
#
# Packages and their inputs:
#
# - connector-protocol: its own directory. artifact.json binds
#   package.json, README.md, the build script, tsconfig.build.json and src/.
# - collector-runtime: its own directory plus connector-protocol.
#   artifact.json includes connector-protocol's source digest.
# - local-collector: both of the above, plus polyfill-connectors and
#   reference-implementation. It vendors their code, and its smoke test
#   starts the reference server.
# - read-core, cli, mcp-server (under reference-implementation/vendor/):
#   reference-implementation and the shared test runners in scripts/. The
#   cli tests also spawn local-collector, so cli follows its inputs too.
#   mcp-server packs cli and read-core from source as its siblings.
#
# Every package also depends on the root package.json, package-lock.json,
# and .npmrc (install and toolchain versions) and on this workflow file.
#
# Skips: `gate` is the single context to make required. It accepts a
# skipped `verify` ONLY when `classify` succeeded and selected no package. If
# `classify` selected a package, `verify` must report success; skipped,
# cancelled, or failed is red. If `classify` itself fails, the gate is red.

env:
  # onnxruntime-node's install script downloads the CUDA 12 provider binaries
  # from nuget.org on linux/x64 even on CPU-only runners; that download is the
  # ETIMEDOUT flake that fails `npm ci`. No job here requests the CUDA execution
  # provider and the CPU binding ships in the package tarball, so skip it.
  # scripts/ci-onnxruntime-install.test.ts guards this setting.
  ONNXRUNTIME_NODE_INSTALL: "skip"

on:
  pull_request:
    # PRs into the test-engineering integration branch are gated by a local
    # oracle and review; full CI runs once on the batch PR into main.
    branches-ignore: [testeng/integration]
  merge_group: {}

concurrency:
  group: package-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify package-verify inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select packages whose inputs changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          # A failed diff exits non-zero (set -e), which fails this job and so
          # the gate. Missing shas are an error, not an empty change set.
          if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo "::error::missing base or head sha for ${GITHUB_EVENT_NAME}"
            exit 1
          fi
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/changed-files.txt"

          protocol=false
          runtime=false
          collector=false
          readcore=false
          cli=false
          mcp=false
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|.npmrc|.releaserc.yaml|.github/workflows/package-verify.yml|\
              packages/connector-protocol/*)
                protocol=true; runtime=true; collector=true; readcore=true; cli=true; mcp=true ;;
              packages/collector-runtime/*)
                runtime=true; collector=true; cli=true; mcp=true ;;
              packages/local-collector/*|packages/polyfill-connectors/*)
                collector=true; cli=true; mcp=true ;;
              reference-implementation/*)
                collector=true; readcore=true; cli=true; mcp=true ;;
              scripts/test-scratch/*|scripts/run-node-tests.mjs)
                readcore=true; cli=true; mcp=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          # Workspace paths, in verify order: each package after the packages
          # it depends on.
          packages=""
          [[ "${protocol}" == "true" ]] && packages+="packages/connector-protocol "
          [[ "${runtime}" == "true" ]] && packages+="packages/collector-runtime "
          [[ "${collector}" == "true" ]] && packages+="packages/local-collector "
          [[ "${readcore}" == "true" ]] && packages+="reference-implementation/vendor/read-core "
          [[ "${cli}" == "true" ]] && packages+="reference-implementation/vendor/cli "
          [[ "${mcp}" == "true" ]] && packages+="reference-implementation/vendor/mcp-server "
          packages="${packages% }"

          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "Selected packages: ${packages:-none}"

  verify:
    name: verify selected packages
    needs: classify
    if: needs.classify.outputs.packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mcp-server's artifact receipt binds a merge-base with a fixed
          # commit, which a shallow clone does not have.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify packages
        env:
          PACKAGES: ${{ needs.classify.outputs.packages }}
        run: |
          set -euo pipefail
          for package in ${PACKAGES}; do
            echo "::group::verify ${package}"
            npm run --workspace "${package}" verify
            echo "::endgroup::"
          done

  # cli and read-core declare `engines.node >=22.14.0` and publish from this
  # repository. `verify` above runs on Node 24, which proves nothing about the
  # floor, so their dedicated gates pack, install and run the artifact on the
  # exact Node 22.14.0 runtime. Dependencies install with Node 24 first,
  # because the workspace root requires it.
  node-floor:
    name: Node 22.14 floor for cli and read-core
    needs: classify
    if: contains(needs.classify.outputs.packages, 'vendor/cli') || contains(needs.classify.outputs.packages, 'vendor/read-core')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The CLI gate's harness hosts the reference server, which needs this
      # newer Node; only the installed CLI runs on 22.14.
      - name: Record the harness Node
        run: echo "PDPP_ARTIFACT_HARNESS_NODE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"

      - name: Run the floor gates
        env:
          PACKAGES: ${{ needs.classify.outputs.packages }}
        run: |
          set -euo pipefail
          node --version
          if [[ " ${PACKAGES} " == *" reference-implementation/vendor/read-core "* ]]; then
            npm run --workspace reference-implementation/vendor/read-core verify:node-22.14
          fi
          if [[ " ${PACKAGES} " == *" reference-implementation/vendor/cli "* ]]; then
            npm run --workspace reference-implementation/vendor/cli pack-install-run:node-22.14
          fi

  gate:
    name: package-verify gate
    needs: [classify, verify, node-floor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require verify for every selected package
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PACKAGES: ${{ needs.classify.outputs.packages }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          NODE_FLOOR_RESULT: ${{ needs.node-floor.result }}
        run: |
          set -euo pipefail
          if [[ "${CLASSIFY_RESULT}" != "success" ]]; then
            echo "::error::classify reported ${CLASSIFY_RESULT}"
            exit 1
          fi
          if [[ -z "${PACKAGES}" ]]; then
            if [[ "${VERIFY_RESULT}" != "skipped" ]]; then
              echo "::error::no package inputs changed, but verify reported ${VERIFY_RESULT}"
              exit 1
            fi
            echo "No package inputs changed; verify skipped."
            exit 0
          fi
          if [[ "${VERIFY_RESULT}" != "success" ]]; then
            echo "::error::verify for [${PACKAGES}] reported ${VERIFY_RESULT}"
            exit 1
          fi
          if [[ " ${PACKAGES} " == *" reference-implementation/vendor/cli "* || " ${PACKAGES} " == *" reference-implementation/vendor/read-core "* ]]; then
            if [[ "${NODE_FLOOR_RESULT}" != "success" ]]; then
              echo "::error::the Node 22.14 floor gate reported ${NODE_FLOOR_RESULT}"
              exit 1
            fi
          fi
          echo "verify passed for: ${PACKAGES}"
