name: Consumer drift signal

# Event-driven producer-side counterpart to PDP-Connect/data-connectors'
# .github/workflows/cross-repo-integrity.yml. That workflow only catches drift when
# data-connectors itself runs (push/PR/weekly schedule there) — up to a week late for a change
# that lands here first. This workflow gives an immediate signal AT the producer: on every
# push or PR touching any of the paths data-connectors' drift jobs actually compare, fetch the
# consumer's pinned SHA and fail fast if this repo's canonical paths moved beyond it.
#
# No cross-repo secret exists (both repos are public) — this only ever does an unauthenticated
# raw fetch of data-connectors' default-branch pin file, never a push or write back.
#
# Guarded paths and their consumer come from reading data-connectors'
# .github/scripts/cross-repo-integrity/ directly. The data-connect pin backs THREE duplicate
# classes there (2026-08-18 final-v2 red-team, "Decisive technical blocker: freshness
# coverage omits two duplicate classes"):
#
#   (a) collector definitions snapshot — check-collector-definitions-drift.mjs regenerates
#       packages/local-collector/src/generated/collector-definitions.generated.ts from this
#       repo's checkout and compares it byte-for-byte against the committed file, so both the
#       generator and the generated file are guarded paths.
#   (b) vendored connector sources — check-connector-source-drift.mjs byte-compares each
#       vendored connector directory under packages/polyfill-connectors/connectors/<id>/
#       against data-connectors' canonical copy, for whichever IDs
#       collector-definitions.generated.ts currently declares. The trigger-path list below is
#       necessarily static (GitHub Actions can't compute `on.paths` at runtime), so the job
#       itself re-derives that ID set from the generated file and asserts it against the
#       hard-coded list below — see the "Assert hard-coded connector list matches the
#       registry-derived set" step. A registry change that adds/removes a bundled connector
#       without updating this workflow's trigger list fails loudly instead of silently
#       narrowing coverage.
#   (c) runtime/protocol package artifacts — check-tarball-digest-drift.sh rebuilds
#       @pdpp/collector-runtime and @pdpp/connector-protocol from a data-connect checkout
#       pinned to .github/cross-repo-pins.json's data-connect SHA and compares the packed
#       content against its committed vendor/SHA256SUMS.
#
# This workflow file and .github/consumer-drift-signal-config.json (the fail-closed activation
# switch, see the job below) are also guarded paths in their own right, per the reviewer's
# "Producer workflows should include their own control files in triggers" hardening finding:
# a PR that only edits either of them would otherwise not trigger this signal at all.

on:
  push:
    paths:
      - "packages/collector-runtime/**"
      - "packages/connector-protocol/**"
      - "packages/local-collector/scripts/generate-collector-definitions-snapshot.ts"
      - "packages/local-collector/src/generated/collector-definitions.generated.ts"
      - "packages/polyfill-connectors/connectors/claude_code/**"
      - "packages/polyfill-connectors/connectors/codex/**"
      - "packages/polyfill-connectors/connectors/google_takeout/**"
      - "packages/polyfill-connectors/connectors/imessage/**"
      - "packages/polyfill-connectors/connectors/apple_photos/**"
      - "packages/polyfill-connectors/connectors/google_messages/**"
      - ".github/workflows/consumer-drift-signal.yml"
      - ".github/consumer-drift-signal-config.json"
  pull_request:
    paths:
      - "packages/collector-runtime/**"
      - "packages/connector-protocol/**"
      - "packages/local-collector/scripts/generate-collector-definitions-snapshot.ts"
      - "packages/local-collector/src/generated/collector-definitions.generated.ts"
      - "packages/polyfill-connectors/connectors/claude_code/**"
      - "packages/polyfill-connectors/connectors/codex/**"
      - "packages/polyfill-connectors/connectors/google_takeout/**"
      - "packages/polyfill-connectors/connectors/imessage/**"
      - "packages/polyfill-connectors/connectors/apple_photos/**"
      - "packages/polyfill-connectors/connectors/google_messages/**"
      - ".github/workflows/consumer-drift-signal.yml"
      - ".github/consumer-drift-signal-config.json"

permissions:
  contents: read

jobs:
  check-consumer-pin:
    name: Check data-connectors' recorded pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert hard-coded connector list matches the registry-derived set
        run: |
          set -euo pipefail

          derived="$(node -e '
            const fs = require("fs");
            const src = fs.readFileSync("packages/local-collector/src/generated/collector-definitions.generated.ts", "utf8");
            const ids = [...src.matchAll(/connector_id:\s*"([^"]+)"/g)].map((m) => m[1]).sort();
            console.log(ids.join(" "));
          ')"

          hardcoded="apple_photos claude_code codex google_messages google_takeout imessage"

          if [[ "$derived" != "$hardcoded" ]]; then
            echo "::error::this workflow's hard-coded trigger paths cover connectors [$hardcoded]," >&2
            echo "::error::but packages/local-collector/src/generated/collector-definitions.generated.ts" >&2
            echo "::error::currently declares [$derived]. Update this workflow's on.push/on.pull_request" >&2
            echo "::error::paths (and this check's \$hardcoded list) to match before merging." >&2
            exit 1
          fi

          echo "OK: this workflow's hard-coded connector trigger paths ($hardcoded) match the set derived"
          echo "from collector-definitions.generated.ts."

      - name: Fetch data-connectors' pin file and compare
        env:
          GUARDED_PATHS: >-
            packages/collector-runtime
            packages/connector-protocol
            packages/local-collector/scripts/generate-collector-definitions-snapshot.ts
            packages/local-collector/src/generated/collector-definitions.generated.ts
            packages/polyfill-connectors/connectors/claude_code
            packages/polyfill-connectors/connectors/codex
            packages/polyfill-connectors/connectors/google_takeout
            packages/polyfill-connectors/connectors/imessage
            packages/polyfill-connectors/connectors/apple_photos
            packages/polyfill-connectors/connectors/google_messages
        run: |
          set -euo pipefail

          consumer_pin_required="$(node -p 'require("./.github/consumer-drift-signal-config.json").consumer_pin_required === true')"
          echo "Fail-closed activation (.github/consumer-drift-signal-config.json consumer_pin_required): $consumer_pin_required"

          echo "Fetching PDP-Connect/data-connectors' default-branch pin file (unauthenticated raw fetch, no secrets)..."
          http_status="$(curl -sS -o pins.json -w '%{http_code}' \
            https://raw.githubusercontent.com/PDP-Connect/data-connectors/main/.github/cross-repo-pins.json || true)"

          if [[ "$http_status" != "200" ]]; then
            if [[ "$consumer_pin_required" == "true" ]]; then
              echo "::error::consumer_pin_required is true but fetching data-connectors' pin file returned HTTP $http_status." >&2
              echo "::error::After activation, an unreachable/non-200 consumer pin fails closed instead of passing." >&2
              exit 1
            fi
            echo "No consumer pin recorded yet — signal inactive (fetch returned HTTP $http_status)."
            echo "This is expected until PDP-Connect/data-connectors' cutover PR merges .github/cross-repo-pins.json to main."
            exit 0
          fi

          pinned_sha="$(node -p 'try { require("./pins.json").repos["data-connect"].sha } catch { "" }' 2>/dev/null || true)"

          if [[ -z "$pinned_sha" ]]; then
            if [[ "$consumer_pin_required" == "true" ]]; then
              echo "::error::consumer_pin_required is true but data-connectors' pin file has no data-connect entry (or is malformed)." >&2
              echo "::error::After activation, a missing/malformed consumer pin entry fails closed instead of passing." >&2
              exit 1
            fi
            echo "No consumer pin recorded yet — signal inactive (data-connectors' pin file exists but has no data-connect entry)."
            echo "This is expected until PDP-Connect/data-connectors' cutover PR merges .github/cross-repo-pins.json to main."
            exit 0
          fi

          if ! [[ "$pinned_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::data-connectors' recorded data-connect pin is not 40 lowercase hex characters: '$pinned_sha'" >&2
            if [[ "$consumer_pin_required" == "true" ]]; then
              echo "::error::After activation, an invalid pinned SHA fails closed instead of passing." >&2
              exit 1
            fi
            echo "Signal inactive pre-activation despite the malformed SHA — see consumer_pin_required in"
            echo ".github/consumer-drift-signal-config.json."
            exit 0
          fi

          echo "Consumer pin found: data-connect @ $pinned_sha"

          if ! git cat-file -e "$pinned_sha" 2>/dev/null; then
            echo "Pinned SHA $pinned_sha is not reachable from this checkout (fetch-depth was widened above; if this"
            echo "still fails, the pin may reference a commit this workflow's checkout doesn't have)."
            exit 1
          fi

          if git diff --quiet "$pinned_sha" HEAD -- $GUARDED_PATHS; then
            echo "OK: no change under \$GUARDED_PATHS since the consumer's pinned SHA ($pinned_sha)."
            exit 0
          fi

          echo "FAIL: one or more guarded paths changed since PDP-Connect/data-connectors last pinned this repo"
          echo "at $pinned_sha:"
          echo "  $GUARDED_PATHS"
          echo
          echo "Changed paths:"
          git diff --name-only "$pinned_sha" HEAD -- $GUARDED_PATHS
          echo
          echo "This means data-connectors' vendored tarballs and/or connector-source copies"
          echo "(packages/polyfill-connectors/vendor/, packages/polyfill-connectors/connectors/<id>/,"
          echo "packages/local-collector/src/generated/collector-definitions.generated.ts) are now stale against"
          echo "this repo's canonical source. Coordinated repin procedure:"
          echo "  1. Open a PR in PDP-Connect/data-connectors that rebuilds/repacks the vendored tarballs and/or"
          echo "     connector-source copies from this repo's new HEAD and updates the relevant committed"
          echo "     digests/copies."
          echo "  2. In that same PR, update .github/cross-repo-pins.json's data-connect entry to this repo's new"
          echo "     HEAD SHA, with a note explaining why the pin moved."
          echo "  3. Merge that PR. This signal will go green on the next push/PR here once the pin catches up."
          echo "Do not edit data-connectors' pin file from this repo — it is that repo's own record, updated only there."
          exit 1
