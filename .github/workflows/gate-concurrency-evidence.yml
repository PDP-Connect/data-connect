name: gate-concurrency-evidence

# Replays the archived memory-default concurrency evidence.
#
# This is a conditional evidence suite, not part of the ordinary
# reference-implementation test plan: it runs only when the archive, its
# summary, the receipt builder/verifier, the replay itself, or the parser
# dependencies those two rely on change. There is deliberately no schedule --
# archived bytes do not change on their own, so a timer would only add noise.
#
# The replay is also runnable by hand from reference-implementation/:
#   node --test --experimental-strip-types scripts/evidence/gate-concurrency-receipts.test.ts

on:
  pull_request:
    paths:
      - .github/workflows/gate-concurrency-evidence.yml
      - reference-implementation/docs/gate-concurrency.md
      - reference-implementation/docs/receipts/gate-concurrency-20260903.summary.json
      - reference-implementation/docs/receipts/gate-concurrency-20260903.tar.gz
      - reference-implementation/scripts/evidence/gate-concurrency-receipts.test.ts
      - reference-implementation/scripts/gate-concurrency-receipt.test.ts
      - reference-implementation/scripts/gate-concurrency-receipt.ts
      # Parser dependencies of the builder/verifier: a change in either can
      # alter re-derived counts or digests without touching the files above.
      - reference-implementation/scripts/test-accounting/inventory.ts
      - reference-implementation/scripts/test-accounting/receipt.ts
  merge_group: {}
  workflow_dispatch: {}

concurrency:
  group: gate-concurrency-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: replay archived gate concurrency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Verify the receipt builder and verifier
        working-directory: reference-implementation
        run: node --test --experimental-strip-types scripts/gate-concurrency-receipt.test.ts

      - name: Replay the archived evidence
        working-directory: reference-implementation
        run: node --test --experimental-strip-types scripts/evidence/gate-concurrency-receipts.test.ts
