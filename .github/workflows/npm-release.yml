name: npm-release

# Publishes @pdpp/connector-protocol and @pdpp/collector-runtime to npm via
# semantic-release, using OIDC trusted publishing (id-token: write, no
# NPM_TOKEN) — the same mechanism PDP-Connect/pdpp already runs for
# @pdpp/cli, @pdpp/mcp-server, and @pdpp/read-core. See .releaserc.yaml for
# which commits actually trigger a release: this workflow's `quality` and
# `release` jobs only run at all when resolve-version's dry run found one.
#
# Scoped to just these two npm packages: this repo also ships a Tauri
# desktop app via .github/workflows/release.yml (a completely separate
# artifact class — GitHub Release installers, not npm packages), which this
# workflow does not touch.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: resolve next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.version.outputs.new-release-published }}
      new-release-version: ${{ steps.version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.version.outputs.new-release-git-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run release:npm:dry-run 2>&1 | tee "$RUNNER_TEMP/semantic-release-dry-run.log"
          node --import tsx scripts/semantic-release-github-output.ts dry-run "$RUNNER_TEMP/semantic-release-dry-run.log"

  quality:
    name: release quality checks
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify connector-protocol package
        run: npm run --workspace packages/connector-protocol verify

      - name: Verify collector-runtime package
        run: npm run --workspace packages/collector-runtime verify

      - name: Test commit-analyzer scope gate
        run: npx vitest run scripts/npm-release-commit-analyzer.test.ts

      - name: Test attestation signer-workflow binding
        run: npx vitest run scripts/npm-release-signer-workflow.test.ts

  release:
    name: publish to npm and GitHub
    needs: [resolve-version, quality]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing — no NPM_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:npm

      # Proves the npm-provenance binding claimed in
      # packages/connector-protocol/scripts/package-artifact.mjs actually
      # holds for the version just published — with REAL verification, not
      # a bare JSON-field presence check. A prior revision of this step only
      # checked that npm view's `dist.attestations.url` was non-empty, which
      # proves an attestation URL exists but does not verify the attestation
      # itself (its Sigstore signature, or that it was produced by THIS
      # repository's workflow). This step instead:
      #   1. Downloads the ACTUAL published tarball from the npm registry
      #      (npm pack <pkg>@<version>) — a real artifact to verify, not a
      #      local rebuild that could differ from what was published.
      #   2. Runs `gh attestation verify` against that tarball, which
      #      downloads the artifact's Sigstore attestation, verifies its
      #      cryptographic signature, and validates the attestation's
      #      claimed source repository/workflow identity against an
      #      expected value — real subject+source+workflow verification.
      # `--repo PDP-Connect/data-connect` scopes verification to this exact
      # repository (the strictest single-repo check gh attestation verify
      # supports via --repo/--owner). `--source-digest "$GITHUB_SHA"`
      # additionally binds verification to the exact commit SHA that
      # triggered this workflow run. `--signer-workflow` additionally binds
      # verification to the EXACT workflow file that must have produced the
      # attestation ([host/]<owner>/<repo>/<path>/<to>/<workflow>, per `gh
      # attestation verify --help`) — without it, `--repo` alone would
      # accept an attestation signed by ANY workflow in this repository, not
      # just this release workflow, so a compromised or malicious workflow
      # added to this same repo could forge a passing attestation for an
      # artifact it built. All three flags together prove the published
      # tarball's attestation was produced by THIS workflow file, in this
      # repository, at this exact commit.
      # This has NOT been exercised against a real npm registry response
      # yet: neither package has been published from this workflow before,
      # and this sandbox has no working `gh auth` session with real
      # registry access. It is written to fail loudly (non-zero exit,
      # explicit message) rather than silently pass if verification fails.
      # `--source-digest` and `--signer-workflow`'s exact expected formats
      # have only been checked against `gh attestation verify --help`'s
      # description (see .github/workflows/npm-release-signer-workflow.test.ts
      # for a static check of the flag/value shape), not against a real
      # attestation from this workflow — confirm on the first real release
      # and adjust either flag's value/format if verification fails for a
      # reason unrelated to a genuine provenance mismatch.
      - name: Verify npm provenance attestation
        if: needs.resolve-version.outputs.new-release-published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.new-release-version }}"
          for pkg in "@pdpp/connector-protocol" "@pdpp/collector-runtime"; do
            workdir="$(mktemp -d)"
            echo "Downloading published ${pkg}@${version} from npm registry..."
            npm pack "${pkg}@${version}" --pack-destination "$workdir" --foreground-scripts=false
            tarballs=("$workdir"/*.tgz)
            if [ "${#tarballs[@]}" -ne 1 ]; then
              echo "FAIL: expected exactly one .tgz in ${workdir} after npm pack ${pkg}@${version}, found ${#tarballs[@]}" >&2
              exit 1
            fi
            tarball="${tarballs[0]}"
            echo "Verifying Sigstore attestation for ${tarball}..."
            gh attestation verify "$tarball" \
              --repo PDP-Connect/data-connect \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "PDP-Connect/data-connect/.github/workflows/npm-release.yml"
            rm -rf "$workdir"
          done
