name: npm-release

# Publishes @pdpp/connector-protocol and @pdpp/collector-runtime to npm via
# semantic-release, using OIDC trusted publishing (id-token: write, no
# NPM_TOKEN) — the same mechanism PDP-Connect/pdpp already runs for
# @pdpp/cli, @pdpp/mcp-server, and @pdpp/read-core. See .releaserc.yaml for
# which commits actually trigger a release: this workflow's `quality` and
# `release` jobs only run at all when resolve-version's dry run found one.
#
# Scoped to just these two npm packages: this repo also ships a Tauri
# desktop app via .github/workflows/release.yml (a completely separate
# artifact class — GitHub Release installers, not npm packages), which this
# workflow does not touch.
#
# FORCED RELEASES: the scope gate above has one silent failure mode — a real
# packaged change that lands under an unscoped `fix:` or a `chore:` re-vendor
# commit resolves no version, so `quality` and `release` skip and nothing
# publishes, with no failure to notice. The `release_type` dispatch input is
# the honest way out: it forces a bump when the packages have shipped
# changes no commit scope announced. It does NOT weaken the gate for
# ordinary pushes — a push with no `release_type` runs exactly the commit
# analysis it always did. A forced run still goes through the SAME `quality`
# job and the same OIDC trusted publishing; the only thing bypassed is which
# commits count as releasable. See scripts/forced-release-config.ts.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        # `none` is a sentinel, not an empty string: an empty `options` entry
        # is invalid workflow syntax (actionlint: "string should not be
        # empty") and GitHub renders and validates it inconsistently in the
        # dispatch form. `none` is the conventional shape and reads clearly in
        # the run's own inputs display.
        description: "Force a release at this bump, bypassing commit analysis. Leave as none to run ordinary commit analysis."
        required: false
        type: choice
        options: ["none", "patch", "minor", "major"]
        default: "none"
      reason:
        description: "Why this release is being forced (recorded in the run log and job summary). Required when release_type is set."
        required: false
        type: string

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: resolve next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.version.outputs.new-release-published }}
      new-release-version: ${{ steps.version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.version.outputs.new-release-git-tag }}
      mode: ${{ steps.mode.outputs.mode }}
      converge-tag: ${{ steps.mode.outputs.converge-tag }}
      converge-version: ${{ steps.mode.outputs.converge-version }}
      converge-missing: ${{ steps.mode.outputs.converge-missing }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reconciles the two sources of truth the pipeline depends on — the git
      # tags semantic-release reads, and the registry it publishes to — BEFORE
      # deciding what this run does.
      #
      # semantic-release derives versions from tags alone and never asks the
      # registry, so it cannot see a tag that claims a release the registry
      # only partly holds. That blind spot is what turned a mid-publish crash
      # into a repository that could not release at all: with the tag present
      # and no commits after it, every subsequent run resolved "no relevant
      # changes" while two of three packages were still missing.
      #
      # This step looks at both and emits one of two modes:
      #   converge — the newest tag is a partially-completed release. Publish
      #              only the missing packages at that tag's version.
      #   release  — ordinary release (or nothing to do). Unchanged behaviour.
      #
      # It runs first so the decision is made before any publishing job.
      - name: Resolve release mode
        id: mode
        run: node --import tsx scripts/resolve-release-version.ts

      # A forced run resolves its version through the same dry run and the
      # same output parser as an ordinary one — only the commit-analyzer
      # rules differ. That keeps `quality` gating publication in both cases:
      # forcing changes which commits count as releasable, never whether the
      # release has to pass its checks.
      #
      # Skipped entirely on a converge, where the version comes from the tag
      # rather than from commit analysis.
      - name: Determine next version
        id: version
        if: steps.mode.outputs.mode != 'converge'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          REASON: ${{ inputs.reason }}
          FORCED_RELEASE_DRY_RUN: "true"
        # On a `push` event the `inputs` context is empty, so RELEASE_TYPE is
        # the empty string; on a dispatch that is not forcing it is the `none`
        # sentinel. Both mean "run ordinary commit analysis".
        run: |
          set -o pipefail
          if [ -n "$RELEASE_TYPE" ] && [ "$RELEASE_TYPE" != "none" ]; then
            node --import tsx scripts/forced-release.ts "$RELEASE_TYPE" "$REASON" 2>&1 | tee "$RUNNER_TEMP/semantic-release-dry-run.log"
          else
            npm run release:npm:dry-run 2>&1 | tee "$RUNNER_TEMP/semantic-release-dry-run.log"
          fi
          node --import tsx scripts/semantic-release-github-output.ts dry-run "$RUNNER_TEMP/semantic-release-dry-run.log"

  quality:
    name: release quality checks
    needs: resolve-version
    # Gates BOTH publishing paths. A converge publishes real tarballs to the
    # real registry, so it has to clear the same bar as an ordinary release —
    # the packages it ships were never published, and npm immutability means a
    # bad one cannot be replaced afterwards.
    if: >-
      needs.resolve-version.outputs.new-release-published == 'true' ||
      needs.resolve-version.outputs.mode == 'converge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify connector-protocol package
        run: npm run --workspace packages/connector-protocol verify

      - name: Verify collector-runtime package
        run: npm run --workspace packages/collector-runtime verify

      # @pdpp/local-collector is published by this workflow as of the change
      # that added it to .releaserc.yaml, and it is also the largest consumer
      # of the two packages above: it compiles against their source and
      # vendors their built dist/ into its own tarball. So this step guards
      # both the artifact this workflow ships for it and the downstream
      # breakage a sibling release could cause.
      #
      # `verify` runs the package's tests, validate:package, and the
      # packed-consumer smoke test (see packages/local-collector/package.json).
      # validate:package's packed-import checks are what catch an undeclared
      # cross-package import compiled into a tarball. Which assertion fires
      # depends on where the bad import survives: postbuild.ts rewrites a bare
      # `@pdpp/*` specifier to a relative path before packing, so a source
      # import surfaces via assertLiteralRelativeImportsResolve as a relative
      # path escaping the tarball, while one injected into the built artifact
      # after rewriting is caught by assertBareSpecifiersResolve. The smoke
      # test then packs, installs into a clean temp project, and drives the
      # installed CLI's advertise/enroll/run paths against an in-process
      # reference server. Together they cover the import-resolution failure
      # that made every published 1.3.0-1.5.4 unrunnable. Because `quality`
      # must pass before `release`, a failure here blocks publication.
      - name: Verify local-collector package
        run: npm run --workspace packages/local-collector verify

      - name: Test commit-analyzer scope gate
        run: npx vitest run scripts/npm-release-commit-analyzer.test.ts

      - name: Test attestation signer-workflow binding
        run: npx vitest run scripts/npm-release-signer-workflow.test.ts

  release:
    name: publish to npm and GitHub
    needs: [resolve-version, quality]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing — no NPM_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Publishes through the same plugin chain either way. The forced path
      # must re-apply the forced rules here: this job runs a fresh
      # semantic-release, so running the gated config would re-analyze the
      # same commits, resolve nothing, and publish nothing — the exact
      # silent no-op this mechanism exists to end.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -n "$RELEASE_TYPE" ] && [ "$RELEASE_TYPE" != "none" ]; then
            node --import tsx scripts/forced-release.ts "$RELEASE_TYPE" "$REASON"
          else
            npm run release:npm
          fi

      # Proves the npm-provenance binding claimed in
      # packages/connector-protocol/scripts/package-artifact.mjs actually
      # holds for the version just published, at this exact commit — with
      # REAL verification, not a bare JSON-field presence check.
      #
      # A prior revision of this step called `gh attestation verify` against
      # GitHub's attestations API with no bundle, which 404s every time: npm
      # trusted publishing stores the SLSA provenance bundle on the npm
      # registry packument (`dist.attestations`), never in GitHub's
      # attestations store. See scripts/verify-npm-provenance.ts for the
      # real verification this replaces it with: fetch the bundle straight
      # from the registry, then hand it to `gh attestation verify --bundle`
      # with `--digest-alg sha512` (npm's subject digest is sha512, not the
      # sha256 this flag defaults to) and `--source-digest "$GITHUB_SHA"`,
      # binding verification to this exact commit in addition to the repo,
      # workflow file, and ref `--repo`/`--signer-workflow` already pin.
      #
      # Registry propagation lag: `npm publish` returning success does not
      # mean the version is immediately resolvable — observed ~3 minutes for
      # @pdpp/local-collector@2.1.1 to become fetchable after its publish
      # log said "Published". The script retries on E404 with a bounded
      # wait rather than failing on the first lookup.
      - name: Verify npm provenance attestation
        if: needs.resolve-version.outputs.new-release-published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --import tsx scripts/verify-npm-provenance.ts \
            "${{ needs.resolve-version.outputs.new-release-version }}" \
            "$GITHUB_SHA" \
            "@pdpp/connector-protocol" "@pdpp/collector-runtime" "@pdpp/local-collector"

      # Attestation verification (above) proves provenance — that the
      # published tarballs were built by this workflow at this commit. It
      # says nothing about semantic compatibility between the two packages'
      # published versions. This step installs both just-published packages
      # together into an empty scratch directory (real npm install against
      # the real registry, no workspace/local resolution) and imports every
      # @pdpp/connector-protocol export collector-runtime's source uses,
      # asserting the resolved connector-protocol version matches this
      # release. See scripts/verify-packed-install-capability-exports.mjs.
      - name: Verify packed install exposes required capability exports
        if: needs.resolve-version.outputs.new-release-published == 'true'
        run: |
          node scripts/verify-packed-install-capability-exports.mjs "${{ needs.resolve-version.outputs.new-release-version }}"

  # Finishes a release whose tag is already pushed but whose publishing
  # stopped partway. It publishes ONLY the packages the registry reports as
  # missing at that tag's version, and creates no tag and no GitHub release —
  # the run that pushed the tag already did both.
  #
  # It does not re-run semantic-release, because semantic-release structurally
  # cannot finish this job: it resolves versions from git tags alone, so with
  # the tag present it finds zero commits since the last release and resolves
  # no version at all. Deleting the tag locally does not help either — it runs
  # `git fetch --tags` before enumerating tags and restores it within the same
  # run. Deleting the tag on the remote would work, but a release pipeline
  # must not rewrite the public record of versions that are already live and
  # provenance-attested to work around its own crash. So this job does the one
  # thing actually left outstanding: the publishing.
  converge:
    name: converge a partially-published release
    needs: [resolve-version, quality]
    if: >-
      needs.resolve-version.outputs.mode == 'converge' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Deliberately NOT `contents: write`. Converging must never create a tag
      # or a release, and denying ref-write access makes that structural
      # rather than a promise the script keeps.
      contents: read
      id-token: write # OIDC trusted publishing — no NPM_TOKEN

    steps:
      # Checks out THE TAG, not the push head. A tag records a commit as well
      # as a version, and the packages this job publishes must be built from
      # the tree that tag names — the same tree the ordinary release would
      # have published had it not crashed partway. Building from the push head
      # would ship code the tag never covered under the tag's immutable
      # version: @pdpp/local-collector vendors connector-protocol's built
      # dist/ into its own tarball, so a head-built local-collector@X can
      # embed protocol code that the already-published connector-protocol@X
      # does not contain.
      - name: Checkout the tag being converged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.converge-tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      # Also provides node_modules/.bin/npm — the npm 11 that
      # converge-release.ts publishes through. The runner's ambient npm is 10,
      # which has no OIDC trusted-publishing support at all.
      - name: Install dependencies
        run: npm ci

      - name: Publish the missing packages
        env:
          CONVERGE_RELEASE_TAG: ${{ needs.resolve-version.outputs.converge-tag }}
        run: node --import tsx scripts/converge-release.ts

  # The postcondition of the whole pipeline, on BOTH paths: all three lockstep
  # packages are live at this release's version.
  #
  # "The release job exited 0" is not the same claim as "the release
  # happened" — the half-published v2.2.1 is the proof, and nothing in the
  # pipeline was responsible for noticing the difference. This job re-reads
  # the registry rather than trusting what the publish steps reported about
  # themselves, and fails with the missing packages named if the set is
  # incomplete.
  verify-release-complete:
    name: verify the lockstep release is complete
    needs: [resolve-version, release, converge]
    # always() because exactly one of release/converge runs on any given
    # release; the other is skipped, and a skipped dependency would otherwise
    # skip this job too. The condition then narrows to runs that actually
    # published something.
    if: >-
      always() &&
      (needs.release.result == 'success' || needs.converge.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert all three packages are live at this version
        run: |
          VERSION="${{ needs.resolve-version.outputs.new-release-version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ needs.resolve-version.outputs.converge-version }}"
          fi
          node --import tsx scripts/verify-release-complete.ts "$VERSION"
