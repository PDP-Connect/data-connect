name: reference-implementation

# Originally authored (2026-08-27) as Move-B groundwork, ahead of the actual
# reference-implementation/server code landing in this repo. Move B has since landed:
# reference-implementation/package.json exists, so `has_content` is true and this
# workflow is load-bearing, not the structural no-op it was written as.
#
# `has_content` is retained because it is what distinguishes a real tree from the
# receiving-dock placeholder (reference-implementation/README.md) that shipped in the
# same PR as this workflow -- that placeholder matches the reference-impacting path
# list below, so `classify` alone would not have kept the suite jobs skipped pre-Move-B.
#
# Mirrors PDP-Connect/pdpp's .github/workflows/reference-implementation.yml gate shape
# (same job names, same classify -> per-suite -> aggregate pattern), so the single
# `reference-implementation gate` context stays the one thing to promote if this is ever
# made a required check here -- as of 2026-09-11 it is not; DCO is main's only required
# status check. Adapted for this repo's package manager (npm workspaces, not pnpm) and
# Node floor (>=24.15.0, this repo's package.json engines field, matching pdpp's
# node-version 24).
#
# pdpp's version also gates apps/console and several owner-journey/stream-audit scripts
# that are pdpp-specific (openspec-driven authoring surfaces not part of this repo's
# scope). Those jobs are deliberately NOT ported here — only the parts that map to
# what Move B actually brings into this repo: the reference-implementation package
# itself. Re-derive the full job list against pdpp's then-current workflow when Move B
# lands, since pdpp's own reference-implementation.yml will keep evolving until then.

on:
  pull_request:
    # PRs into the test-engineering integration branch are gated by a local
    # oracle and review; full CI runs once on the batch PR into main.
    branches-ignore: [testeng/integration]
  merge_group: {}
  push:
    branches: [main, integration/unified-stack]
  workflow_dispatch: {}

concurrency:
  # Keyed by ref for PRs and other branches, so a ref's runs supersede each other
  # but never a sibling's. main and integration/unified-stack use sha keys, which
  # give every push its own pass/fail record: a group holds at most one pending run, so
  # a per-ref group would cancel a waiting run when the next merge arrives. On main,
  # merge traffic is high enough for that to bite: over the 30 days to 2026-09-11 it
  # took 48 first-parent commits (26 in
  # the last 7), with 11 gaps under 25 minutes and 3 runs of three commits inside
  # 22 minutes, against a suite that takes about 21. Per-sha groups let each push
  # proceed in parallel rather than queueing; at that rate main reaches at most 3
  # concurrent runs.
  group: reference-implementation-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/unified-stack') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify reference-impacting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reference_impacting: ${{ steps.changes.outputs.reference_impacting }}
      has_content: ${{ steps.has-content.outputs.has_content }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check reference-implementation has real content
        id: has-content
        run: |
          set -euo pipefail
          if [[ -f "reference-implementation/package.json" ]]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "reference-implementation/package.json not found -- Move B hasn't landed real content yet, suite jobs will skip regardless of reference_impacting."
          fi

      - name: Classify reference-impacting changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail

          # Changed-file classification is a pull-request optimization: it keeps a
          # docs-only PR from paying for a 20-minute suite. It is deliberately NOT
          # applied to push, because a branch build answers a different question --
          # "is main green at this commit" -- and that answer must not depend on
          # which files the merge happened to touch. Path-filtering pushes would let
          # main go unjudged after any unrelated merge, which is the blind spot this
          # trigger exists to close.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo "reference_impacting=true" >> "$GITHUB_OUTPUT"
            echo "push to ${GITHUB_REF}: running full reference suite unconditionally."
            exit 0
          fi

          if [[ -z "${BASE_SHA}" ]]; then
            echo "reference_impacting=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch has no PR base; running full reference suite."
            exit 0
          fi

          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/reference-changed-files.txt"

          reference_impacting=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/reference-implementation.yml|\
              package.json|\
              package-lock.json|\
              scripts/test-sandbox/*|\
              scripts/test-scratch/*|\
              reference-implementation/*|reference-implementation/**)
                reference_impacting=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/reference-changed-files.txt"

          echo "reference_impacting=${reference_impacting}" >> "$GITHUB_OUTPUT"
          if [[ "${reference_impacting}" == "true" ]]; then
            echo "Reference-impacting changes detected; running full reference suite."
          else
            echo "No reference-impacting changes detected (or reference-implementation/ does not exist in this repo yet); required context will pass without heavy reference tests."
          fi

  typecheck-reference:
    name: typecheck reference implementation
    needs: classify
    if: needs.classify.outputs.reference_impacting == 'true' && needs.classify.outputs.has_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm

      # npm's download cache is already restored above, yet `npm ci` still takes
      # about 70 s to rebuild node_modules. Restore the installed tree itself,
      # keyed on the lockfile, and install only on a miss.
      - name: Restore installed node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            reference-implementation/node_modules
            packages/local-collector/node_modules
            apps/console/node_modules
            ~/.cache/ms-playwright
          key: node-modules-v2-${{ runner.os }}-node24.21.0-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # A restored tree skips npm's lifecycle scripts, so run what `npm ci`
      # would: the root postinstall and each workspace's `prepare` build, in
      # dependency order.
      - name: Run install lifecycle scripts on a restored tree
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: |
          npm run postinstall
          npm --prefix packages/connector-protocol run build
          npm --prefix packages/collector-runtime run build
          npm --prefix reference-implementation/vendor/read-core run build
          npm --prefix reference-implementation/vendor/mcp-server run build
          npm --prefix reference-implementation/vendor/cli run build

      - name: Build workspace packages
        # The root tsconfig.json's project references only cover the app
        # (tsconfig.app.json/tsconfig.node.json) -- `npx tsc -b` never
        # touches packages/connector-protocol, packages/collector-runtime,
        # or the vendored reference-implementation/vendor/cli+mcp-server,
        # all of which reference-implementation depends on as `dist/`-built
        # workspace packages (not source-resolved). Build each directly.
        run: |
          npm --prefix packages/connector-protocol run build
          npm --prefix packages/collector-runtime run build
          npm --prefix reference-implementation/vendor/mcp-server run build

      - name: Typecheck reference implementation
        run: npm --prefix reference-implementation run typecheck

  test-reference-shard:
    name: test reference implementation shard ${{ matrix.shard }}
    needs: classify
    if: needs.classify.outputs.reference_impacting == 'true' && needs.classify.outputs.has_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm

      # npm's download cache is already restored above, yet `npm ci` still takes
      # about 70 s to rebuild node_modules. Restore the installed tree itself,
      # keyed on the lockfile, and install only on a miss.
      - name: Restore installed node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            reference-implementation/node_modules
            packages/local-collector/node_modules
            apps/console/node_modules
            ~/.cache/ms-playwright
          key: node-modules-v2-${{ runner.os }}-node24.21.0-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # A restored tree skips npm's lifecycle scripts, so run what `npm ci`
      # would: the root postinstall and each workspace's `prepare` build, in
      # dependency order.
      - name: Run install lifecycle scripts on a restored tree
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: |
          npm run postinstall
          npm --prefix packages/connector-protocol run build
          npm --prefix packages/collector-runtime run build
          npm --prefix reference-implementation/vendor/read-core run build
          npm --prefix reference-implementation/vendor/mcp-server run build
          npm --prefix reference-implementation/vendor/cli run build

      - name: Build workspace packages
        # The root tsconfig.json's project references only cover the app
        # (tsconfig.app.json/tsconfig.node.json) -- `npx tsc -b` never
        # touches packages/connector-protocol, packages/collector-runtime,
        # or the vendored reference-implementation/vendor/cli+mcp-server,
        # all of which reference-implementation depends on as `dist/`-built
        # workspace packages (not source-resolved). Build each directly.
        run: |
          npm --prefix packages/connector-protocol run build
          npm --prefix packages/collector-runtime run build
          npm --prefix reference-implementation/vendor/mcp-server run build

      - name: Build console
        # Otherwise composed-origin.test.ts builds it silently mid-gate and
        # trips the no-output watchdog; see scripts/ci-console-prebuild.test.ts.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --prefix apps/console run build

      - name: Report runner CPU admission
        run: |
          node -e 'const os = require("node:os"); const fs = require("node:fs"); console.log(`runner CPUs: logical=${os.cpus().length} available=${os.availableParallelism()}`); for (const path of ["/sys/fs/cgroup/cpu.max", "/sys/fs/cgroup/cpuset.cpus.effective"]) { if (fs.existsSync(path)) console.log(`${path}: ${fs.readFileSync(path, "utf8").trim()}`); }'

      - name: Test reference implementation
        env:
          PDPP_OWNER_PASSWORD: reference-implementation-ci
          PDPP_TEST_PROFILE: "memory-default"
          PDPP_TEST_SHARD_INDEX: ${{ matrix.shard }}
          PDPP_TEST_SHARD_COUNT: "5"
          PDPP_TEST_SHARD_RECEIPT: ${{ runner.temp }}/reference-test-shard-${{ matrix.shard }}.json
          # The hosted runner is a disposable VM, which is the isolation
          # boundary here; test-sandbox runs the command directly.
          TEST_SANDBOX_DISABLE: "1"
        run: npm --prefix reference-implementation run test

      - name: Upload shard accounting receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/reference-test-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  test-reference-implementation:
    name: test reference implementation
    needs: [classify, test-reference-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        if: needs.test-reference-shard.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard accounting receipts
        if: needs.test-reference-shard.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reference-test-shard-*
          merge-multiple: true
          path: shard-receipts

      - name: Verify complete file and skip coverage
        if: needs.test-reference-shard.result == 'success'
        run: node --experimental-strip-types reference-implementation/scripts/verify-test-shards.ts shard-receipts 5

      - name: Require every selected shard to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          REFERENCE_IMPACTING: ${{ needs.classify.outputs.reference_impacting }}
          HAS_CONTENT: ${{ needs.classify.outputs.has_content }}
          SHARD_RESULT: ${{ needs.test-reference-shard.result }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != success ]]; then
            echo "::error::classify reported $CLASSIFY_RESULT"
            exit 1
          fi
          if [[ "$REFERENCE_IMPACTING" != true || "$HAS_CONTENT" != true ]]; then
            [[ "$SHARD_RESULT" == skipped ]] || { echo "::error::unexpected shard result: $SHARD_RESULT"; exit 1; }
            exit 0
          fi
          [[ "$SHARD_RESULT" == success ]] || { echo "::error::one or more shards reported $SHARD_RESULT"; exit 1; }

  check-vendor-freshness:
    name: check polyfill-connectors tarball freshness
    needs: classify
    if: needs.classify.outputs.has_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Check vendored connector-manifests tarball matches its pin
        run: node scripts/check-polyfill-connectors-tarball-freshness.mjs

  gate:
    name: reference-implementation gate
    needs:
      - classify
      - typecheck-reference
      - test-reference-implementation
      - check-vendor-freshness
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required sub-job results
        run: |
          set -euo pipefail

          fail=0
          for job_result in \
            "typecheck-reference:${{ needs.typecheck-reference.result }}" \
            "test-reference-implementation:${{ needs.test-reference-implementation.result }}" \
            "check-vendor-freshness:${{ needs.check-vendor-freshness.result }}"
          do
            name="${job_result%%:*}"
            result="${job_result##*:}"
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::${name} reported ${result}"
              fail=1
            fi
          done

          if [[ "${{ needs.classify.result }}" != "success" ]]; then
            echo "::error::classify reported ${{ needs.classify.result }}"
            fail=1
          fi

          exit "${fail}"
