name: reference-implementation

# Originally authored (2026-08-27) as Move-B groundwork, ahead of the actual
# reference-implementation/server code landing in this repo. Move B has since landed:
# reference-implementation/package.json exists, so `has_content` is true and this
# workflow is load-bearing, not the structural no-op it was written as.
#
# `has_content` is retained because it is what distinguishes a real tree from the
# receiving-dock placeholder (reference-implementation/README.md) that shipped in the
# same PR as this workflow -- that placeholder matches the reference-impacting path
# list below, so `classify` alone would not have kept the suite jobs skipped pre-Move-B.
#
# Mirrors PDP-Connect/pdpp's .github/workflows/reference-implementation.yml gate shape
# (same job names, same classify -> per-suite -> aggregate pattern), so the single
# `reference-implementation gate` context stays the one thing to promote if this is ever
# made a required check here -- as of 2026-09-11 it is not; DCO is main's only required
# status check. Adapted for this repo's package manager (npm workspaces, not pnpm) and
# Node floor (>=22.14.0 <24, this repo's package.json engines field, vs. pdpp's
# node-version 24).
#
# pdpp's version also gates apps/console and several owner-journey/stream-audit scripts
# that are pdpp-specific (openspec-driven authoring surfaces not part of this repo's
# scope). Those jobs are deliberately NOT ported here — only the parts that map to
# what Move B actually brings into this repo: the reference-implementation package
# itself. Re-derive the full job list against pdpp's then-current workflow when Move B
# lands, since pdpp's own reference-implementation.yml will keep evolving until then.

on:
  pull_request: {}
  merge_group: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Keyed by ref for PRs and branches, so a ref's runs supersede each other but
  # never a sibling's. main is keyed by sha instead, which is what actually gives
  # every merge commit its own pass/fail record: a group holds at most one pending
  # run, so a per-ref main group would have GitHub cancel the waiting run when the
  # next merge arrives, leaving that commit permanently unjudged -- the same blind
  # spot as having no push trigger at all. Merge traffic is high enough for that to
  # bite: over the 30 days to 2026-09-11 main took 48 first-parent commits (26 in
  # the last 7), with 11 gaps under 25 minutes and 3 runs of three commits inside
  # 22 minutes, against a suite that takes about 21. Per-sha groups each hold one
  # run, so main's runs proceed in parallel rather than queueing; at that rate it is
  # at most 3 concurrent.
  group: reference-implementation-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify reference-impacting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reference_impacting: ${{ steps.changes.outputs.reference_impacting }}
      has_content: ${{ steps.has-content.outputs.has_content }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check reference-implementation has real content
        id: has-content
        run: |
          set -euo pipefail
          if [[ -f "reference-implementation/package.json" ]]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "reference-implementation/package.json not found -- Move B hasn't landed real content yet, suite jobs will skip regardless of reference_impacting."
          fi

      - name: Classify reference-impacting changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail

          # Changed-file classification is a pull-request optimization: it keeps a
          # docs-only PR from paying for a 20-minute suite. It is deliberately NOT
          # applied to push, because a branch build answers a different question --
          # "is main green at this commit" -- and that answer must not depend on
          # which files the merge happened to touch. Path-filtering pushes would let
          # main go unjudged after any unrelated merge, which is the blind spot this
          # trigger exists to close.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo "reference_impacting=true" >> "$GITHUB_OUTPUT"
            echo "push to ${GITHUB_REF}: running full reference suite unconditionally."
            exit 0
          fi

          if [[ -z "${BASE_SHA}" ]]; then
            echo "reference_impacting=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch has no PR base; running full reference suite."
            exit 0
          fi

          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/reference-changed-files.txt"

          reference_impacting=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/reference-implementation.yml|\
              package.json|\
              package-lock.json|\
              reference-implementation/*|reference-implementation/**)
                reference_impacting=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/reference-changed-files.txt"

          echo "reference_impacting=${reference_impacting}" >> "$GITHUB_OUTPUT"
          if [[ "${reference_impacting}" == "true" ]]; then
            echo "Reference-impacting changes detected; running full reference suite."
          else
            echo "No reference-impacting changes detected (or reference-implementation/ does not exist in this repo yet); required context will pass without heavy reference tests."
          fi

  typecheck-reference:
    name: typecheck reference implementation
    needs: classify
    if: needs.classify.outputs.reference_impacting == 'true' && needs.classify.outputs.has_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        # The root tsconfig.json's project references only cover the app
        # (tsconfig.app.json/tsconfig.node.json) -- `npx tsc -b` never
        # touches packages/connector-protocol, packages/collector-runtime,
        # or the vendored reference-implementation/vendor/cli+mcp-server,
        # all of which reference-implementation depends on as `dist/`-built
        # workspace packages (not source-resolved). Build each directly.
        run: |
          npm --prefix packages/connector-protocol run build
          npm --prefix packages/collector-runtime run build
          npm --prefix reference-implementation/vendor/mcp-server run build

      - name: Typecheck reference implementation
        run: npm --prefix reference-implementation run typecheck

  test-reference-implementation:
    name: test reference implementation
    needs: classify
    if: needs.classify.outputs.reference_impacting == 'true' && needs.classify.outputs.has_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        # The root tsconfig.json's project references only cover the app
        # (tsconfig.app.json/tsconfig.node.json) -- `npx tsc -b` never
        # touches packages/connector-protocol, packages/collector-runtime,
        # or the vendored reference-implementation/vendor/cli+mcp-server,
        # all of which reference-implementation depends on as `dist/`-built
        # workspace packages (not source-resolved). Build each directly.
        run: |
          npm --prefix packages/connector-protocol run build
          npm --prefix packages/collector-runtime run build
          npm --prefix reference-implementation/vendor/mcp-server run build

      - name: Build console
        # Otherwise composed-origin.test.ts builds it silently mid-gate and
        # trips the no-output watchdog; see scripts/ci-console-prebuild.test.ts.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --prefix apps/console run build

      - name: Test reference implementation
        env:
          PDPP_OWNER_PASSWORD: reference-implementation-ci
          PDPP_TEST_PROFILE: "memory-default"
        run: npm --prefix reference-implementation run test

  gate:
    name: reference-implementation gate
    needs:
      - classify
      - typecheck-reference
      - test-reference-implementation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required sub-job results
        run: |
          set -euo pipefail

          fail=0
          for job_result in \
            "typecheck-reference:${{ needs.typecheck-reference.result }}" \
            "test-reference-implementation:${{ needs.test-reference-implementation.result }}"
          do
            name="${job_result%%:*}"
            result="${job_result##*:}"
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::${name} reported ${result}"
              fail=1
            fi
          done

          if [[ "${{ needs.classify.result }}" != "success" ]]; then
            echo "::error::classify reported ${{ needs.classify.result }}"
            fail=1
          fi

          exit "${fail}"
